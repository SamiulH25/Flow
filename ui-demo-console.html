<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flow</title>
<style>
@font-face{font-family:'InterVar';src:url('data/fonts/Inter.ttf') format('truetype');font-weight:100 900;font-display:swap}
@font-face{font-family:'GroteskVar';src:url('data/fonts/SpaceGrotesk.ttf') format('truetype');font-weight:300 700;font-display:swap}
@font-face{font-family:'MonoVar';src:url('data/fonts/JetBrainsMono.ttf') format('truetype');font-weight:400 600;font-display:swap}

:root{
  /* elevation ladder — small, deliberate steps, never a flat grey wash */
  --bg:#08090b;  --s1:#0b0d10;  --s2:#0f1216;  --s3:#14181d;  --s4:#1b2027;
  --ln:rgba(255,255,255,.065);
  --ln2:rgba(255,255,255,.11);
  --tx:#edf0f4;  --tx2:#98a1ae;  --tx3:#5d6573;
  --acc:#00e5a0;
  --acc-a:.14; --acc-b:.30;
  --acc-ink:#001a10;
  --warn:#ffb020;

  --r-s:6px; --r-m:9px; --r-l:14px;
  --ui:'InterVar',Inter,system-ui,-apple-system,sans-serif;
  --dp:'GroteskVar','InterVar',system-ui,sans-serif;
  --mono:'MonoVar',ui-monospace,Menlo,monospace;
  --t:140ms cubic-bezier(.4,0,.2,1);
  --np-w:336px; --side-w:224px; --bar-h:76px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--ui); font-size:14px; color:var(--tx); background:var(--bg);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  display:grid; grid-template-rows:minmax(0,1fr) var(--bar-h); height:100vh; overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
::selection{background:var(--acc);color:var(--acc-ink)}
.tnum{font-variant-numeric:tabular-nums}

/* scrollbars stay in the palette */
.sc{scrollbar-width:thin;scrollbar-color:var(--s4) transparent}
.sc::-webkit-scrollbar{width:10px;height:10px}
.sc::-webkit-scrollbar-thumb{background:var(--s4);border:3px solid transparent;background-clip:content-box;border-radius:8px}
.sc::-webkit-scrollbar-thumb:hover{background:#2a313a;background-clip:content-box}

.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr) var(--np-w);min-height:0}

/* ============================ SIDEBAR ============================ */
.side{background:var(--s1);border-right:1px solid var(--ln);display:flex;flex-direction:column;min-height:0;padding:0 10px 10px}
.brand{display:flex;align-items:center;gap:9px;padding:16px 8px 14px;flex-shrink:0}
.brand .mk{width:26px;height:26px;border-radius:7px;flex-shrink:0;
  background:linear-gradient(145deg,var(--acc),#00916a);
  display:grid;place-items:center;box-shadow:0 2px 10px -2px rgba(0,229,160,.45)}
.brand b{font-family:var(--dp);font-weight:700;font-size:16px;letter-spacing:-.03em}
.brand span{margin-left:auto;font-size:10px;color:var(--tx3);font-family:var(--mono)}

.nav{display:flex;flex-direction:column;gap:1px;flex-shrink:0}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:var(--r-s);
  color:var(--tx2);text-decoration:none;font-size:13.5px;font-weight:500;transition:background var(--t),color var(--t)}
.nav a:hover{background:var(--s3);color:var(--tx)}
.nav a.on{background:var(--s3);color:var(--tx);box-shadow:inset 2px 0 0 var(--acc)}
.nav a.on svg{color:var(--acc)}
.nav a svg{color:var(--tx3);flex-shrink:0;transition:color var(--t)}
.nav a .c{margin-left:auto;font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums}
.nav a.on .c{color:var(--acc)}
.nav .run{font-size:10.5px;color:var(--acc);margin-left:auto;display:flex;align-items:center;gap:5px}
.nav .run i{width:5px;height:5px;border-radius:50%;background:var(--acc);animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

.sect{margin:20px 0 6px;padding:0 9px;display:flex;align-items:center;gap:6px}
.sect span{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3)}
.sect button{margin-left:auto;font-size:10.5px;color:var(--tx3);padding:2px 5px;border-radius:4px;transition:color var(--t)}
.sect button:hover{color:var(--acc);background:var(--s3)}

.mixlist{overflow-y:auto;flex:1;min-height:0;margin:0 -2px;padding:0 2px}
.mix{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:var(--r-s);cursor:pointer;
  color:var(--tx2);font-size:13px;transition:background var(--t),color var(--t)}
.mix:hover{background:var(--s3);color:var(--tx)}
.mix.on{background:var(--s3);color:var(--tx)}
.mix .cv{width:26px;height:26px;border-radius:5px;flex-shrink:0}
.mix span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mix i{margin-left:auto;font-style:normal;font-size:10.5px;color:var(--tx3);font-variant-numeric:tabular-nums}

.stor{margin-top:auto;padding:11px 10px 4px;border-top:1px solid var(--ln);flex-shrink:0}
.stor .t{display:flex;justify-content:space-between;font-size:11px;color:var(--tx3);margin-bottom:6px}
.stor .b{height:3px;border-radius:2px;background:var(--s3);overflow:hidden}
.stor .b i{display:block;height:100%;width:64%;background:var(--acc);border-radius:2px}

/* ============================ MAIN ============================ */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.top{display:flex;align-items:center;gap:12px;padding:13px 20px;flex-shrink:0;border-bottom:1px solid var(--ln);min-height:58px}
.top h1{font-family:var(--dp);font-size:19px;font-weight:700;letter-spacing:-.028em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:12.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb{display:flex;align-items:center;gap:7px;min-width:0}
.crumb button{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--tx2);padding:3px 7px;border-radius:5px;transition:.14s}
.crumb button:hover{color:var(--tx);background:var(--s3)}
.crumb .sepc{color:var(--tx3);flex-shrink:0}

.search{margin-left:auto;display:flex;align-items:center;gap:7px;background:var(--s2);border:1px solid var(--ln);
  border-radius:7px;padding:0 9px;height:32px;width:212px;transition:border-color var(--t),background var(--t)}
.search:focus-within{border-color:var(--ln2);background:var(--s3)}
.search svg{color:var(--tx3);flex-shrink:0}
.search input{background:none;border:0;outline:none;width:100%;font-size:13px}
.search input::placeholder{color:var(--tx3)}
.search kbd{font-family:var(--mono);font-size:9.5px;color:var(--tx3);border:1px solid var(--ln2);border-radius:4px;padding:1px 4px;flex-shrink:0}
/* the now-playing panel is always visible above the drawer tier */
#toggleNp{display:none}
.iconbtn{width:32px;height:32px;border-radius:7px;display:grid;place-items:center;color:var(--tx2);
  border:1px solid var(--ln);transition:.14s;flex-shrink:0}
.iconbtn:hover{background:var(--s3);color:var(--tx)}
.iconbtn.on{background:var(--acc-a);color:var(--acc);border-color:var(--acc-b)}

.scroll{flex:1;overflow-y:auto;min-height:0;padding:0 20px 28px}
.crumbs{padding:14px 0 2px}

/* filter row */
.filters{display:flex;align-items:center;gap:7px;padding:14px 0 12px;flex-wrap:wrap}
.seg{display:flex;background:var(--s2);border:1px solid var(--ln);border-radius:7px;padding:2px;gap:2px}
.seg button{padding:4px 11px;border-radius:5px;font-size:12.5px;font-weight:500;color:var(--tx2);transition:.14s}
.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--s4);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.35)}
select{background:var(--s2);border:1px solid var(--ln);border-radius:7px;padding:6px 9px;font-size:12.5px;
  color:var(--tx2);cursor:pointer;outline:none;transition:.14s}
select:hover{border-color:var(--ln2);color:var(--tx)}
.count{margin-left:auto;font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums}
.btn{background:var(--s2);border:1px solid var(--ln);border-radius:7px;padding:6px 11px;font-size:12.5px;
  font-weight:500;color:var(--tx2);transition:.14s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--s3);color:var(--tx);border-color:var(--ln2)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.btn.pri:hover{background:#00f5ac}

/* ============================ ALBUM ART ============================ */
.cv{position:relative;overflow:hidden;flex-shrink:0;background:var(--s3);border-radius:var(--r-m)}
.cv::before{content:'';position:absolute;inset:0;background-image:var(--g);background-size:cover}
.cv::after{content:'';position:absolute;inset:0;border-radius:inherit;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08), inset 0 -40% 70% -30% rgba(0,0,0,.55)}
.cv.r0{border-radius:4px}
.cv.r50{border-radius:50%}

/* ============================ TRACK LIST ============================ */
.tl{border:1px solid var(--ln);border-radius:var(--r-l);overflow:hidden;background:var(--s1)}
.th{display:grid;grid-template-columns:30px minmax(0,1fr) 132px 54px 104px 54px;gap:12px;align-items:center;
  padding:0 12px;height:34px;background:var(--s2);border-bottom:1px solid var(--ln);
  font-size:10.5px;font-weight:600;letter-spacing:.055em;text-transform:uppercase;color:var(--tx3)}
.th .r{text-align:right}
.row{display:grid;grid-template-columns:30px minmax(0,1fr) 132px 54px 104px 54px;gap:12px;align-items:center;
  padding:0 12px;height:42px;cursor:pointer;position:relative;
  border-bottom:1px solid rgba(255,255,255,.035);transition:background var(--t)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--s2)}
.row.on{background:var(--acc-a)}
.row.on:hover{background:rgba(0,229,160,.18)}
.row.on::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--acc)}
.row .ix{font-size:11.5px;color:var(--tx3);text-align:center;font-variant-numeric:tabular-nums;
  display:flex;align-items:center;justify-content:center}
.row.on .ix{color:var(--acc)}
.row .ti{display:flex;align-items:center;gap:10px;min-width:0}
.row .ti .cv{width:30px;height:30px;border-radius:5px}
.row .ti .tx{min-width:0}
.row .ti b{display:block;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.row.on .ti b{color:var(--acc);font-weight:600}
.row .ti .tx > span{display:block;font-size:11.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.row .ab,.row .du{font-size:12.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .du{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:11.5px}
.row .sig{height:20px;display:flex;align-items:center;gap:1px;overflow:hidden}
.row .sig i{flex:1;background:#2b323b;border-radius:1px;min-width:1px}
.fmt{font-family:var(--mono);font-size:9.5px;color:var(--tx3);letter-spacing:.02em;margin-left:6px}
.fmt.hi{color:#6ba8ff}
.acts{display:flex;gap:2px;justify-content:flex-end;opacity:0;transition:opacity var(--t)}
.row:hover .acts,.row.on .acts{opacity:1}
.acts button{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;color:var(--tx3);transition:.14s}
.acts button:hover{background:var(--s4);color:var(--tx)}
.acts button.like{color:var(--acc)}
.acts button:hover.like{background:rgba(0,229,160,.16);color:var(--acc)}

/* album strip + grid */
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:118px;gap:12px;padding:2px 0 18px;
  overflow-x:auto;scroll-snap-type:x proximity}
.strip .al{scroll-snap-align:start;display:flex;flex-direction:column;gap:7px;cursor:pointer;min-width:0}
.strip::-webkit-scrollbar{height:0}
.al .cv{width:100%;aspect-ratio:1;transition:transform var(--t),box-shadow var(--t)}
.al:hover .cv{transform:translateY(-3px);box-shadow:0 10px 22px -12px rgba(0,0,0,.9)}
.al b{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al span{font-size:11.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:20px 16px;padding:2px 0}
.gal .cv{width:100%;aspect-ratio:1;margin-bottom:9px;transition:transform var(--t),box-shadow var(--t)}
.gal:hover .cv{transform:translateY(-3px);box-shadow:0 12px 26px -14px rgba(0,0,0,.9)}
.gal b{font-size:13px;font-weight:600;display:block;line-height:1.35}
.gal span{font-size:11.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

/* ============================ MIXES / DOWNLOADS ============================ */
.mrow{display:flex;align-items:center;gap:13px;padding:10px 12px;border-radius:var(--r-m);cursor:pointer;transition:background var(--t)}
.mrow:hover{background:var(--s2)}
.mrow .cv{width:42px;height:42px;border-radius:var(--r-s)}
.mrow b{font-size:13.5px;font-weight:600}
.mrow span{font-size:12px;color:var(--tx3);margin-left:9px}
.mrow .x{margin-left:auto;display:flex;gap:6px;opacity:0;transition:opacity var(--t)}
.mrow:hover .x{opacity:1}
.mrow .x button{font-size:11px;padding:4px 9px;border-radius:6px;border:1px solid var(--ln2);color:var(--tx2);transition:.14s}
.mrow .x button:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-a)}

.paste{display:flex;background:var(--s2);border:1px solid var(--ln);border-radius:var(--r-m);overflow:hidden;
  transition:border-color var(--t);margin-bottom:14px}
.paste:focus-within{border-color:var(--acc-b)}
.paste input{flex:1;background:none;border:0;outline:none;padding:11px 14px;font-size:13px;min-width:0}
.paste input::placeholder{color:var(--tx3)}
.paste .go{background:var(--acc);color:var(--acc-ink);font-weight:600;font-size:12.5px;padding:0 18px;transition:.14s}
.paste .go:hover{background:#00f5ac}
.job{border:1px solid var(--ln);border-radius:var(--r-m);background:var(--s1);overflow:hidden;margin-bottom:9px}
.jhead{display:flex;align-items:center;gap:11px;padding:11px 13px;cursor:pointer;transition:background var(--t)}
.jhead:hover{background:var(--s2)}
.jkind{font-size:9.5px;font-weight:600;letter-spacing:.05em;padding:2px 6px;border-radius:4px;
  background:var(--s3);color:var(--tx2);flex-shrink:0}
.jhead b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
.jhead .u{flex:1;min-width:0;font-family:var(--mono);font-size:11px;color:var(--tx3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jpct{font-family:var(--mono);font-size:11.5px;color:var(--tx2);font-variant-numeric:tabular-nums;flex-shrink:0}
.jgo{font-size:11px;padding:3px 9px;border-radius:6px;border:1px solid var(--ln2);color:var(--tx2);flex-shrink:0;transition:.14s}
.jgo:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-a)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ln)}
.step{padding:7px 13px;font-size:11px;color:var(--tx3);display:flex;align-items:center;gap:7px;
  border-right:1px solid var(--ln);transition:color var(--t)}
.step:last-child{border-right:0}
.step .d{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ln2);display:grid;place-items:center;
  font-size:8px;font-weight:700;flex-shrink:0;line-height:1}
.step.run{color:var(--tx)}
.step.run .d{border-color:var(--acc);color:var(--acc)}
.step.ok .d{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.jbar{height:2px;background:var(--s3)}
.jbar i{display:block;height:100%;background:var(--acc);transition:width .3s linear}
.jlist{display:none;border-top:1px solid var(--ln)}
.jlist.open{display:block}
.ji{display:flex;align-items:center;gap:10px;padding:7px 13px;font-size:12.5px;border-bottom:1px solid rgba(255,255,255,.035)}
.ji:last-child{border-bottom:0}
.ji .s{font-family:var(--mono);font-size:10px;color:var(--tx3);width:62px;flex-shrink:0}
.ji .s.ok{color:var(--acc)}
.ji .s.skip{color:var(--warn)}
.ji b{font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ji .p{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--acc);font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--tx3);line-height:1.75;max-width:64ch;padding:2px 0 18px}
.note b{color:var(--tx2);font-weight:600}
.note code{font-family:var(--mono);font-size:11.5px;color:var(--tx2);background:var(--s2);padding:1px 5px;border-radius:4px}
.empty{text-align:center;padding:56px 20px;color:var(--tx3);font-size:13px}
.empty b{display:block;font-family:var(--dp);font-size:16px;color:var(--tx2);margin-bottom:5px}
.empty u{cursor:pointer;color:var(--acc);text-decoration:none;border-bottom:1px solid transparent}
.empty u:hover{border-bottom-color:var(--acc)}

/* ============================ NOW PLAYING ============================ */
.np{background:var(--s2);border-left:1px solid var(--ln);display:flex;flex-direction:column;min-height:0}
.np-art{padding:20px 20px 0;flex-shrink:0}
.np-art .cv{width:100%;aspect-ratio:1;border-radius:var(--r-l);box-shadow:0 18px 40px -20px rgba(0,0,0,.95)}
.np-meta{padding:16px 20px 0;flex-shrink:0}
.np-meta h2{font-family:var(--dp);font-size:22px;font-weight:700;letter-spacing:-.032em;line-height:1.2;
  overflow-wrap:anywhere}
.np-meta .a{font-size:13px;color:var(--tx2);margin-top:5px;line-height:1.5}
.np-meta .a b{color:var(--tx);font-weight:600}
.np-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}
.chip{font-size:10.5px;padding:2.5px 7px;border-radius:5px;background:var(--s3);color:var(--tx2);font-weight:500}
.chip.acc{background:var(--acc-a);color:var(--acc)}
.chip.cool{background:rgba(76,139,255,.14);color:#6ba8ff}

/* seekable waveform */
.wave{margin:16px 20px 0;padding:8px 0;cursor:pointer;touch-action:none;flex-shrink:0;position:relative}
.wave .bars{height:40px;display:flex;align-items:center;gap:1px}
.wave .bars i{flex:1;background:#39414c;border-radius:1px;min-width:1px;pointer-events:none}
.wave .bars i.pk{background:#4d5766}
.wave .play{position:absolute;inset:8px 0;display:flex;align-items:center;gap:1px;
  clip-path:inset(0 calc(100% - var(--p,0%)) 0 0);pointer-events:none}
.wave .play i{flex:1;background:var(--acc);border-radius:1px;min-width:1px}
.wave .ticks{display:flex;justify-content:space-between;margin-top:5px;
  font-family:var(--mono);font-size:9.5px;color:var(--tx3);font-variant-numeric:tabular-nums}
.wave .hd{position:absolute;top:2px;bottom:16px;width:1px;background:#fff;opacity:0;pointer-events:none;transition:opacity var(--t)}
.wave:hover .hd{opacity:.7}
.wave .hov{position:absolute;bottom:26px;transform:translateX(-50%);background:var(--tx);color:var(--bg);
  font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:4px;opacity:0;pointer-events:none;transition:opacity var(--t);white-space:nowrap}
.wave:hover .hov{opacity:1}

.np-tabs{display:flex;margin:16px 20px 0;border-bottom:1px solid var(--ln);flex-shrink:0;gap:2px}
.np-tabs button{padding:8px 12px 9px;font-size:12.5px;font-weight:500;color:var(--tx3);position:relative;transition:color var(--t)}
.np-tabs button:hover{color:var(--tx2)}
.np-tabs button.on{color:var(--tx)}
.np-tabs button.on::after{content:'';position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--acc);border-radius:2px}
.np-body{flex:1;overflow-y:auto;min-height:0;padding:8px 0 16px}

.qi{display:flex;align-items:center;gap:10px;padding:7px 20px;cursor:grab;position:relative;transition:background var(--t)}
.qi:hover{background:var(--s3)}
.qi.drag{opacity:.35}
.qi.over::before{content:'';position:absolute;left:20px;right:20px;top:-1px;height:2px;background:var(--acc);border-radius:2px}
.qi.on{background:var(--acc-a)}
.qi .cv{width:28px;height:28px;border-radius:5px}
.qi .tx{min-width:0;flex:1}
.qi .tx b{display:block;font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qi.on .tx b{color:var(--acc)}
.qi .tx span{display:block;font-size:11px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qi .d{font-family:var(--mono);font-size:10.5px;color:var(--tx3);font-variant-numeric:tabular-nums}
.qi .x{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:var(--tx3);opacity:0;transition:.14s;flex-shrink:0}
.qi:hover .x{opacity:1}
.qi .x:hover{background:var(--s4);color:var(--tx)}
.qh{display:flex;align-items:center;padding:4px 20px 8px}
.qh span{font-size:11px;color:var(--tx3)}
.qh button{margin-left:auto;font-size:11px;color:var(--tx3);padding:3px 8px;border-radius:5px;border:1px solid var(--ln2)}
.qh button:hover{color:var(--acc);border-color:var(--acc-b)}

.lr{padding:6px 20px 20px}
.lr p{font-size:14px;line-height:1.75;color:var(--tx3);transition:color 260ms ease;cursor:pointer;border-radius:4px}
.lr p:hover{color:var(--tx2)}
.lr p.on{color:var(--tx);font-weight:600}
.lr p.hit{color:var(--acc)}
.lr .ti{color:var(--tx3);font-style:italic;font-size:12.5px;margin-bottom:10px}

/* ============================ PLAYER BAR ============================ */
.bar{background:var(--s1);border-top:1px solid var(--ln);display:grid;
  grid-template-columns:var(--side-w) 1fr var(--np-w);align-items:center;min-width:0}
.bar .a{padding:0 16px;display:flex;align-items:center;gap:11px;min-width:0}
.bar .a .cv{width:42px;height:42px;border-radius:var(--r-s)}
.bar .a .tx{min-width:0;flex:1}
.bar .a b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.bar .a span{display:block;font-size:11.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}

.ctr{display:flex;align-items:center;gap:5px;padding:0 12px;min-width:0}
.pb{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--tx);transition:.14s}
.pb:hover{background:var(--s3)}
.pb.big{width:40px;height:40px;background:var(--tx);color:var(--bg);margin:0 4px}
.pb.big:hover{background:var(--acc);color:var(--acc-ink);transform:scale(1.06)}
.pb:disabled{color:var(--s4);cursor:not-allowed}
.pb:disabled:hover{background:none;transform:none}
.seek{flex:1;min-width:0;margin:0 14px;cursor:pointer;touch-action:none;position:relative;padding:8px 0}
.seek .tr{height:4px;border-radius:2px;background:var(--s3);position:relative}
.seek .fl{position:absolute;inset:0;width:0;background:var(--acc);border-radius:2px}
.seek .kn{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;background:var(--tx);
  transform:translate(-50%,-50%) scale(0);transition:transform 140ms cubic-bezier(.4,0,.2,1)}
.seek:hover .kn{transform:translate(-50%,-50%) scale(1)}
.seek .tt{position:absolute;bottom:16px;transform:translateX(-50%);background:var(--tx);color:var(--bg);
  font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:4px;opacity:0;pointer-events:none;transition:opacity 140ms;white-space:nowrap}
.seek:hover .tt{opacity:1}
.times{font-family:var(--mono);font-size:11.5px;color:var(--tx2);font-variant-numeric:tabular-nums;
  display:flex;gap:4px;white-space:nowrap;flex-shrink:0}
.times b{color:var(--tx);font-weight:500}

.tools{display:flex;align-items:center;gap:6px;padding:0 16px 0 10px;justify-content:flex-end}
.tgl{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--tx3);transition:.14s}
.tgl:hover{background:var(--s3);color:var(--tx)}
.tgl.on{color:var(--acc);background:var(--acc-a)}
.vol{display:flex;align-items:center;gap:8px;margin-left:6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:82px;height:16px;background:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;
  background:linear-gradient(to right,var(--acc) var(--f,80%),var(--s3) var(--f,80%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
  background:var(--tx);margin-top:-3.5px;transition:transform 120ms}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.2)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--s3)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--acc)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:var(--tx)}

/* ============================ MISC ============================ */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none;backdrop-filter:blur(2px)}
body.drawer .scrim{display:block}
.toast{position:fixed;left:50%;bottom:calc(var(--bar-h) + 18px);transform:translate(-50%,10px);
  background:var(--s4);border:1px solid var(--ln2);color:var(--tx);font-size:12.5px;font-weight:500;
  padding:8px 15px;border-radius:8px;z-index:200;opacity:0;pointer-events:none;
  transition:opacity 200ms,transform 200ms cubic-bezier(.4,0,.2,1);box-shadow:0 12px 30px -12px rgba(0,0,0,.9)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============================ RESPONSIVE ============================ */
/* drop the ALBUM column before the waveform column */
@media (max-width:1280px){
  :root{--np-w:300px;--side-w:200px}
  .th,.row{grid-template-columns:30px minmax(0,1fr) 54px 96px 54px}
}
/* now-playing becomes a slide-over that shares the main grid cell */
@media (max-width:1060px){
  :root{--side-w:196px}
  .app{grid-template-columns:var(--side-w) minmax(0,1fr);grid-template-rows:minmax(0,1fr);overflow:hidden}
  /* pin all three regions: .np overlays .main, and auto-placement would
     otherwise drop .main into the sidebar's column */
  .side{grid-column:1;grid-row:1}
  .main{grid-column:2;grid-row:1;min-width:0}
  .np{grid-column:2;grid-row:1;justify-self:end;width:min(360px,86vw);min-width:0;z-index:50;
    box-shadow:-24px 0 60px -30px #000;transform:translateX(101%);
    transition:transform 260ms cubic-bezier(.4,0,.2,1)}
  body.drawer .np{transform:none}
  #toggleNp{display:grid}
  .bar{grid-template-columns:var(--side-w) 1fr auto}
  .tools{grid-column:3}
}
/* sidebar becomes an icon rail */
@media (max-width:880px){
  :root{--side-w:60px}
  .side{padding:0 8px 10px;align-items:center}
  .brand{padding:14px 0 12px}
  .brand b,.brand span,.nav a span,.nav a .c,.sect,.mix span,.mix i,.stor{display:none}
  .nav{width:100%}
  .nav a{justify-content:center;padding:9px 0}
  .nav .run{margin:0;position:absolute}
  .mixlist{width:100%;overflow:visible}
  .mix{justify-content:center;padding:5px 0}
  .bar .a{display:none}
  .bar{grid-template-columns:1fr auto}
}
/* condensed player */
@media (max-width:700px){
  :root{--bar-h:66px}
  .top{padding:11px 14px;gap:9px;min-height:52px}
  .top h1{font-size:16px}
  .search{width:38px;padding:0 9px}
  .search input,.search kbd{display:none}
  .search:focus-within{width:170px}
  .search:focus-within input{display:block}
  .scroll{padding:0 14px 22px}
  .th,.row{grid-template-columns:26px minmax(0,1fr) 48px 54px;gap:9px;padding:0 10px}
  .th .c-al,.th .c-sig,.row .ab,.row .sig{display:none}
  .acts{opacity:1}
  .times{display:none}
  .ctr{padding:0 8px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:16px 12px}
  .steps{grid-template-columns:1fr 1fr}
  .step:nth-child(2){border-right:0}
  .wave{margin:12px 14px 0}
  .np-art,.np-meta{padding-left:14px;padding-right:14px}
  .np-tabs{margin:12px 14px 0}
  .qi,.qh,.lr{padding-left:14px;padding-right:14px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>

/* ==================================================================
   WAVEFORM — deterministic RMS overview (cached per track in the index)
   ================================================================== */
function lcg(str){
  let s = 2166136261 >>> 0;
  for (let i=0;i<str.length;i++){ s ^= str.charCodeAt(i); s = Math.imul(s, 16777619) >>> 0; }
  return () => ((s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296);
}
const WAVE = {};
function wave(id, n){
  const k = id+'|'+n;
  if (WAVE[k]) return WAVE[k];
  const rnd = lcg(id), out = []; let env = .4;
  for (let i=0;i<n;i++){
    const p = i/n;
    const shape = .42 + .58*Math.sin(Math.PI*Math.pow(p,.75));
    const phrase = .72 + .28*Math.sin(p*Math.PI*2*3.1);
    env = env*.7 + (.32 + rnd()*.68)*.3;
    out.push(Math.max(.08, Math.min(1, env*shape*phrase*(.74+rnd()*.46))));
  }
  return (WAVE[k] = out);
}

function setPlaying(on){
  S.playing = on;
  $('#iPlay').style.display = on ? 'none' : '';
  $('#iPause').style.display = on ? '' : 'none';
  save();
}
function playIndex(i){
  if (i < 0 || i >= S.queue.length) return;
  S.cur = S.queue[i]; S.pos = 0; setPlaying(true); renderAll();
}
function playId(id){
  if (S.cur === id && S.pos > 0){ setPlaying(true); renderAll(); return; }
  const i = S.queue.indexOf(id);
  if (i >= 0) playIndex(i); else { S.queue.push(id); playIndex(S.queue.length-1); }
}
function step(dir){
  if (!S.queue.length) return;
  const i = S.queue.indexOf(S.cur);
  let n;
  if (S.shuffle){
    n = 1 + Math.floor(Math.random()*S.queue.length);
    if (n === i+dir && S.queue.length > 1) n = 1 + Math.floor(Math.random()*S.queue.length);
  } else n = i + dir;
  if (n < 0){
    if (S.repeat === 'all') n = S.queue.length-1;
    else { S.pos = 0; setPlaying(false); renderAll(); return; }
  }
  if (n >= S.queue.length){
    if (S.repeat === 'all') n = 0;
    else { S.pos = curT().d; setPlaying(false); renderAll(); return; }
  }
  playIndex(n);
}
function seek(s){ S.pos = Math.max(0, Math.min(curT().d, s)); paint(); save(); }
function setVol(v){
  S.vol = Math.max(0, Math.min(1, v));
  if (S.vol > 0) S.muted = false;
  paintVol(); save();
}
function cycleRepeat(){

function addDownload(raw){
  const url = raw.trim();
  if (!/^(https?:\/\/)?(www\.|music\.)?(youtube\.com|youtu\.be)\//i.test(url)) { toast('Not a YouTube link'); return; }
  if (DOWNLOADS.filter(j=>j.st==='run').length >= 3){ toast('Three jobs at once — wait for one to finish'); return; }
  const kind = /browse\/MPREb|list=OLAK5uy/i.test(url) ? 'ALBUM'
             : /[?&]list=/.test(url) ? 'PLAYLIST' : 'SONG';
  const n = kind==='SONG' ? 1 : 2 + Math.floor(Math.random()*4);
  const pick = a => a[Math.floor(Math.random()*a.length)];
  const albumName = kind==='SONG' ? pick(YT_TITLES) : pick(YT_ALBUMS);
  DOWNLOADS.unshift({ id:'dl'+Date.now(), url, kind, artist:pick(YT_ARTISTS), album:albumName,
    title:'Reading metadata…', st:'run', step:0, p:0, open:false,
    items:Array.from({length:n},(_,i)=>({ t: kind==='SONG' ? albumName+' (Official Audio)' : pick(YT_TITLES),
      st: i===0 ? 'pct' : i<2 ? 'done' : 'queued', p: i===0 ? 0 : 100 })) });
  renderBody(); renderNav(); toast('Queued: ' + kind);
}
const YTHUES = [['#ff6a4d','#7d1f3c','#170a12'],['#6ed3ff','#1b4a6e','#08161f'],['#ffd166','#a8551a','#1d1105'],
  ['#b98cff','#3a1d6d','#100820'],['#ff8fab','#7a2244','#1c0812'],['#ffb347','#7c3a10','#1a0d04'],

function ytAlbum(j){
  let A = ALBUMS.find(x=>x.yt && x.a===j.artist && x.n===j.album);
  if (!A){
    A = {id:'yt'+ALBUMS.length, n:j.album, a:j.artist, yr:new Date().getFullYear(),
         art:YTHUES[ALBUMS.length%8], comp:Object.keys(COMPOSERS)[ALBUMS.length%8], yt:true};
    ALBUMS.push(A);
  }
  return A.id;
}
function tickDownloads(dt){
  let dirty = false;
  for (const j of DOWNLOADS){
    if (j.st !== 'run') continue;
    j.p = Math.min(100, j.p + dt*(j.p<4 ? 26 : 13));
    const st = Math.min(3, Math.floor(j.p/25));
    if (st !== j.step){ j.step = st; dirty = true; }
    if (j.step >= 1 && j.title === 'Reading metadata…'){
      j.title = j.kind==='SONG' ? j.items[0].t : j.album+' — '+j.items.length+' '+(j.items.length===1?'track':'tracks');
      dirty = true;
    }
    const act = j.items.find(i=>i.st==='pct');
    if (act) act.p = Math.min(100, act.p + dt*7);
    const q = j.items.find(i=>i.st==='queued');
    if (q && !act && j.p > 12){
      j.items.forEach(i=>{ if (i.st==='pct'){ i.st='done'; i.p=100; } });
      if (Math.random() < .18) q.st = 'skip'; else { q.st = 'pct'; q.p = 0; }
      dirty = true;
    }
    if (j.p >= 100){
      j.p = 100; j.st = 'done'; j.step = 4;
      j.items.forEach(i=>{ if (i.st!=='skip'){ i.st='done'; i.p=100; } });
      const alId = ytAlbum(j);                       // the rescan
      j.items.filter(i=>i.st==='done').forEach((it,k)=>{
        if (TRACKS.some(t=>t.id===j.id+'-'+k)) return;
        TRACKS.push({id:j.id+'-'+k, al:alId, t:it.t, a:j.artist, d:150+Math.floor(Math.random()*150),
          f:'MP3', k:16, bit:44, bpm:100, key:'—', pl:0, liked:0, add:new Date().toISOString().slice(0,10)});
      });
      dirty = true; toast('Finished: ' + j.title);
    }
  }
  if (dirty){ renderBody(); renderNav(); }
}

/* ==================================================================
   NOW PLAYING
   ================================================================== */
function renderNp(){
  const t = curT(), A = album(t.al);
  $('#npArt').className = 'cv';
  $('#npArt').setAttribute('style', artStyle(t.al));
  $('#npTitle').textContent = t.t;
  $('#npBy').innerHTML = `<b>${esc(t.a)}</b> · ${esc(A.n)}`;
  $('#npChips').innerHTML =
    `<span class="chip ${t.k===24&&t.bit>48?'cool':'acc'}">${t.f} ${t.k}/${t.bit}</span>
     <span class="chip">${t.bpm} BPM</span><span class="chip">${esc(t.key)}</span>
     <span class="chip">${t.pl.toLocaleString()} plays</span>`;
  renderWave();
  renderNpBody();
}
function renderWave(){
  const t = curT(), n = 120, w = wave(t.id, n);
  const bars = w.map(v=>`<i class="${v>.93?'pk':''}" style="height:${Math.round(v*100)}%"></i>`).join('');
  $('#wBars').innerHTML = bars;
  $('#wPlay').innerHTML = w.map(v=>`<i style="height:${Math.round(v*100)}%"></i>`).join('');
  $('#wEnd').textContent = fmtLong(t.d);
}
function renderNpBody(){
  $$('.np-tabs button').forEach(b=>b.classList.toggle('on', b.dataset.t===S.tab));
  const el = $('#npBody');
  if (S.tab === 'queue'){
    el.innerHTML = `<div class="qh"><span>${S.queue.length} in queue</span><button data-a="qclear">Clear</button></div>` +
      S.queue.map((id,i)=>{
        const t = track(id); if (!t) return '';
        return `<div class="qi ${id===S.cur?'on':''}" draggable="true" data-qi="${i}">
          ${artHTML(t.al,'r0')}
          <div class="tx"><b>${esc(t.t)}</b><span>${esc(t.a)}</span></div>
          <span class="d">${id===S.cur?'Playing':fmtLong(t.d)}</span>
          <button class="x" data-a="qdel" data-id="${id}">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
          </button></div>`;
      }).join('') || `<div class="empty"><b>Queue is empty</b>Play something.</div>`;
    if (S.scrollQueue){
      const on = el.querySelector('.qi.on');
      if (on) el.scrollTop = Math.max(0, on.offsetTop - 60);
      S.scrollQueue = false;
    }
  } else {
    const L = LYRICS[S.cur];
    el.innerHTML = L
      ? `<div class="lr">${L.map((l,i)=>`<p data-t="${l[0]}" data-i="${i}">${esc(l[1])}</p>`).join('')}</div>`
      : `<div class="empty"><b>No lyrics</b>No .lrc file beside the audio, and nothing in the tags.</div>`;
    syncLyrics();
  }
}
function syncLyrics(){
  const L = LYRICS[S.cur]; if (!L || S.tab!=='lyrics') return;
  let idx = 0; L.forEach((l,i)=>{ if (S.pos >= l[0]) idx = i; });
  const box = $('#npBody .lr'); if (!box) return;
  $$('p', box).forEach((p,i)=>{ p.classList.toggle('on', i===idx); p.classList.toggle('hit', i<idx); });
  const p = box.querySelector(`p[data-i="${idx}"]`);
  if (p) box.parentElement.scrollTop = Math.max(0, p.offsetTop - box.clientHeight*0.4);
}
function paint(){
  const t = curT(), d = t.d || 1, p = Math.max(0, Math.min(1, S.pos/d));
  $('#seekFill').style.width = (p*100)+'%';
  $('#seekKnob').style.left = (p*100)+'%';
  $('#tCur').textContent = fmtT(S.pos);
  $('#tDur').textContent = fmtT(t.d);
  $('#wave').style.setProperty('--p', (p*100)+'%');
  const w = $('#wave'), h = w.clientHeight || 70;
  $('#wHead').style.left = p*w.clientWidth + 'px';
  $('#wHov').style.left = Math.max(14, Math.min(w.clientWidth-14, p*w.clientWidth)) + 'px';
  if (S.tab === 'lyrics') syncLyrics();
}
function paintBar(){
  const t = curT();
  $('#barArt').setAttribute('style', artStyle(t.al));
  $('#barTitle').textContent = t.t;
  $('#barBy').textContent = `${t.a} — ${album(t.al).n}`;
  $('#shuf').classList.toggle('on', S.shuffle);
  $('#rep').classList.toggle('on', S.repeat!=='off');
  $('#rep').title = 'Repeat: ' + S.repeat;
  $('#like').classList.toggle('on', S.liked.has(t.id));
  paintVol();
}
function paintVol(){
  const v = $('#vol');
  v.value = Math.round(S.vol*100);
  v.style.setProperty('--f', Math.round(S.vol*100)+'%');
}
function renderAll(){ renderNav(); renderBody(); renderNp(); paintBar(); }

/* ==================================================================
   EVENTS
   ================================================================== */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-a],[data-v],[data-mix],[data-t]');
  if (!el) return;
  e.preventDefault();

  if (el.dataset.t && el.classList.contains('np-tabs') === false && el.closest('.np-tabs')){
    S.tab = el.dataset.t;
    if (S.tab === 'queue') S.scrollQueue = true;
    renderNpBody(); paint();
    if (innerWidth <= 1060) document.body.classList.remove('drawer');
    return;
  }
  if (el.dataset.v){
    S.view = el.dataset.v; S.ctx = null; S.q = ''; $('#q').value = '';
    goto(); return;
  }
  if (el.dataset.mix){ S.view = 'mixes'; S.ctx = {k:'mx', id:el.dataset.mix}; goto(); return; }
  const a = el.dataset.a, id = el.dataset.id;
  switch(a){
    case 'play':     playId(id); break;
    case 'like':     toggleLike(id); break;
    case 'queue':    S.queue.splice(S.queue.indexOf(S.cur)+1, 0, id);
                     toast('Playing next: ' + track(id).t); renderNpBody(); break;
    case 'album':    S.view = 'albums'; S.ctx = {k:'al', id}; goto(false); break;
    case 'mix':      S.view = 'mixes';  S.ctx = {k:'mx', id}; goto(); break;
    case 'playmix':  S.queue = mixOf(id).ids.slice(); playIndex(0); break;
    case 'delmix':   MIXES = MIXES.filter(m=>m.id!==id);
                     if (S.ctx?.id===id) S.ctx = null;
                     toast('Mix deleted'); goto(); break;
    case 'newmix': {
      const n = prompt('Name this mix:', 'New mix');
      if (n && n.trim()){ MIXES.push({id:'mx'+Date.now(), n:n.trim(), ids:S.queue.slice()});
        toast('Saved ' + n.trim()); goto(); }
      break;
    }
    case 'clearq':   S.q = ''; $('#q').value=''; renderBody(); break;
    case 'qdel':     S.queue = S.queue.filter(x=>x!==id); renderNpBody(); break;
    case 'qclear':   S.queue = [S.cur]; renderNpBody(); break;
    case 'jobtog':   { const j=DOWNLOADS.find(x=>x.id===id); if(j){ j.open=!j.open; renderBody(); } break; }
    case 'jobcancel':{ const j=DOWNLOADS.find(x=>x.id===id);
                       if(j){ j.st='done'; j.p=Math.round(j.p); j.title+=' (cancelled)'; toast('Cancelled'); renderBody(); renderNav(); } break; }
    case 'jobdel':   DOWNLOADS = DOWNLOADS.filter(x=>x.id!==id); renderBody(); renderNav(); break;
    case 'dladd':    addDownload($('#dlUrl').value); break;
  }
  if (el.dataset.a && el.tagName !== 'SELECT') return;
});
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-go="back"]');
  if (b){ S.ctx = null; goto(); }
});
document.addEventListener('change', e=>{ if (e.target.id==='sort'){ S.sort = e.target.value; renderBody(); } });
document.addEventListener('click', e=>{
  const f = e.target.closest('[data-f]');
  if (f){ S.fmt = f.dataset.f; renderBody(); }
});

/* transport controls */
$('#play').onclick  = ()=> setPlaying(!S.playing);
$('#next').onclick  = ()=> step(1);
$('#prev').onclick  = ()=> S.pos > 3 ? seek(0) : step(-1);
$('#like').onclick  = ()=> toggleLike();
$('#shuf').onclick  = ()=>{ S.shuffle = !S.shuffle; paintBar(); toast('Shuffle '+(S.shuffle?'on':'off')); save(); };
$('#rep').onclick   = cycleRepeat;
$('#mute').onclick  = ()=>{ S.muted = !S.muted; paintVol(); save(); toast(S.muted?'Muted':'Unmuted'); };
$('#vol').oninput   = e=> setVol(+e.target.value/100);
$('#newMix').onclick= ()=> $('[data-a="newmix"]')?.click();
$('#toggleNp').onclick = ()=> document.body.classList.toggle('drawer');
$('#scrim').onclick = ()=> document.body.classList.remove('drawer');

/* search */
let qT;
$('#q').addEventListener('input', e=>{ clearTimeout(qT); qT = setTimeout(()=>{ S.q = e.target.value; renderBody(); }, 90); });

/* --- scrubbable: seek bar + waveform --- */
function dragify(el, onMove){
  let on = false;
  const at = e => {
    const r = el.getBoundingClientRect();
    onMove(Math.max(0, Math.min(1, ((e.clientX-r.left)/r.width))), e.clientX, r);
  };
  el.addEventListener('pointerdown', e=>{ on=true; el.setPointerCapture(e.pointerId); at(e); });
  el.addEventListener('pointermove', e=>{ if (on) at(e); });
  el.addEventListener('pointerup',   e=>{ on=false; try{ el.releasePointerCapture(e.pointerId); }catch(_){} });
  el.addEventListener('pointercancel', ()=>{ on=false; });
}
dragify($('#seek'), (f, x, r)=>{
  $('#seekTip').style.left = (f*100)+'%';
  $('#seekTip').textContent = fmtT(f*curT().d);
  seek(f*curT().d);
});
$('#seek').addEventListener('pointermove', e=>{
  const r = $('#seek').getBoundingClientRect();
  const f = Math.max(0, Math.min(1, (e.clientX-r.left)/r.width));
  $('#seekTip').style.left = (f*100)+'%';
  $('#seekTip').textContent = fmtT(f*curT().d);
});
dragify($('#wave'), (f, x, r)=>{
  $('#wHov').style.left = (f*100)+'%';
  $('#wHov').textContent = fmtT(f*curT().d);
  seek(f*curT().d);
});
$('#wave').addEventListener('pointermove', e=>{
  const r = $('#wave').getBoundingClientRect();
  const f = Math.max(0, Math.min(1, (e.clientX-r.left)/r.width));
  $('#wHov').style.left = (f*100)+'%';
  $('#wHov').textContent = fmtT(f*curT().d);
});
/* click a lyric line to jump */
$('#npBody').addEventListener('click', e=>{
  const p = e.target.closest('.lr p');
  if (p) seek(+p.dataset.t);
});

/* queue drag-reorder */
(()=>{
  let from = null;
  const list = $('#npBody');
  list.addEventListener('dragstart', e=>{
    const q = e.target.closest('.qi'); if (!q) return;
    from = +q.dataset.qi; q.classList.add('drag');
    e.dataTransfer.effectAllowed = 'move';
    try{ e.dataTransfer.setData('text/plain', String(from)); }catch(_){}
  });
  list.addEventListener('dragend', ()=>{ $$('.qi').forEach(q=>q.classList.remove('drag','over')); from = null; });
  list.addEventListener('dragover', e=>{
    const q = e.target.closest('.qi'); if (!q || from === null) return;
    e.preventDefault(); $$('.qi').forEach(x=>x.classList.toggle('over', x===q));
  });
  list.addEventListener('drop', e=>{
    const q = e.target.closest('.qi'); if (!q || from === null) return;
    e.preventDefault();
    const to = +q.dataset.qi;
    if (to === from) return;
    const [m] = S.queue.splice(from, 1);
    S.queue.splice(to, 0, m);
    renderNpBody(); toast('Queue reordered');
  });
})();

/* keyboard */
document.addEventListener('keydown', e=>{
  if (e.target.matches('input,select,textarea')){ if (e.key==='Escape') e.target.blur(); return; }
  const k = e.key.toLowerCase();
  if (e.key === 'Escape'){ document.body.classList.remove('drawer'); return; }
  switch(k){
    case ' ':          e.preventDefault(); setPlaying(!S.playing); break;
    case 'arrowright': if (e.shiftKey) setVol(S.vol+0.05); else seek(S.pos+5); break;
    case 'arrowleft':  if (e.shiftKey) setVol(S.vol-0.05); else seek(S.pos-5); break;
    case 'arrowup':    e.preventDefault(); setVol(S.vol+0.05); break;
    case 'arrowdown':  e.preventDefault(); setVol(S.vol-0.05); break;
    case 'n': step(1); break;
    case 'p': S.pos > 3 ? seek(0) : step(-1); break;
    case 's': $('#shuf').click(); break;
    case 'r': cycleRepeat(); break;
    case 'l': toggleLike(); break;
    case 'm': $('#mute').click(); break;
    case '/': e.preventDefault(); $('#q').focus(); break;
  }
});

/* resize: the waveform scrubber is percentage-based, but the head needs px */
let rT;
addEventListener('resize', ()=>{ clearTimeout(rT); rT = setTimeout(paint, 100); });

/* ==================================================================
   LOOP + BOOT
   ================================================================== */
let last = performance.now();
function frame(now){
  const dt = Math.min(.1, (now-last)/1000); last = now;
  if (S.playing){
    S.pos += dt;
    if (S.pos >= curT().d){
      if (S.repeat === 'one') S.pos = 0; else step(1);
    }
    paint();
  }
  tickDownloads(dt);
  requestAnimationFrame(frame);
}
function goto(drawer=true){
  renderAll();
  $('#scroll').scrollTop = 0;
  if (drawer) document.body.classList.remove('drawer');
  save();
}
setPlaying(false);
renderAll();
requestAnimationFrame(frame);
</script>
</body>
